plugins:
  - rubocop-rails
  - rubocop-performance

inherit_from:
  - .rubocop_todo.yml

AllCops:
  NewCops: enable
  DisplayCopNames: true
  Exclude:
    - "db/schema.rb" # You can't touch this
    - ".bundle/**/*" # Auto-generated
    - "bin/**/*"     # Auto-generated
    - "vendor/bundle/**/*"
    # Some forks have schema.rb files in their custom engines
    - "vendor/engines/*/db/schema.rb"
    - "public/**/*"

# Project-specific overrides go here, but try to conform to TXI standards as
# specified in .rubocop-txi.yml when possible.

# We prefer this to a one-liner:
# def methodname
# end
Style/EmptyMethod:
  EnforcedStyle: expanded

# We prefer to not require %w() until you have a larger array
Style/WordArray:
  MinSize: 5

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Style/CollectionQuerying:
  Enabled: false

Rails/HttpPositionalArguments:
  Enabled: false

Rails/StrongParametersExpect:
  Enabled: false

Rails/ApplicationRecord:
  Exclude:
    - "db/migrate/*.rb"
    - "vendor/engines/*/db/migrate/*.rb"

Rails/Output:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "db/migrate/*.rb"
    - "vendor/engines/*/db/migrate/*.rb"

Rails/CreateTableWithTimestamps:
  Exclude:
    - "db/migrate/20100101000000_initial_schema.rb"
    - "db/migrate/20100423185710_create_order_details.rb"
    - "db/migrate/20100528230902_add_product_users_table.rb"
    - "db/migrate/20100715171938_add_journals_table.rb"
    - "db/migrate/20100719192104_add_table_statement_accounts.rb"
    - "db/migrate/20100812170701_add_budgeted_chart_string.rb"
    - "db/migrate/20101015210647_edits_for_invoicing_and_journaling_refacting.rb"
    - "db/migrate/20101018221409_bundle_related_updates.rb"
    - "db/migrate/20110216002247_create_user_roles.rb"
    - "db/migrate/20120209231652_create_product_accessories.rb"
    - "db/migrate/20120510172358_add_bi_table.rb"

Rails/NotNullColumn:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "db/migrate/20100428152408_remove_facility_from_order.rb"
    - "db/migrate/20100430222700_change_reservations.rb"
    - "db/migrate/20100707185202_add_statement_fields.rb"
    - "db/migrate/20100708195447_alter_account_transactions_add_fields.rb"
    - "db/migrate/20100715223533_add_balance_to_journaled_accounts.rb"
    - "db/migrate/20100914171717_add_facility_account_to_account_transactions.rb"
    - "db/migrate/20100930180831_add_facility_account_id_to_journaled_accounts.rb"
    - "db/migrate/20101011184759_add_price_group_type_to_price_groups.rb"
    - "db/migrate/20101015210647_edits_for_invoicing_and_journaling_refacting.rb"
    - "db/migrate/20120502223446_alter_journal_rows_remove_nu.rb"
    - "db/migrate/20131205230514_alter_schedule_rules_drop_duration_mins.rb"

Rails/WhereNotWithMultipleConditions:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "db/migrate/20170501201633_add_canceled_to_order_detail.rb"

Lint/SuppressedException:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "db/migrate/20100701232820_change_order_detail_status.rb"

Rails/HasAndBelongsToMany:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "vendor/engines/*/spec/**/*.rb"
