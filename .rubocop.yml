plugins:
  - rubocop-rails
  - rubocop-performance

inherit_from:
  - .rubocop_todo.yml

AllCops:
  NewCops: enable
  DisplayCopNames: true
  Exclude:
    - "db/schema.rb" # You can't touch this
    - ".bundle/**/*" # Auto-generated
    - "bin/**/*"     # Auto-generated
    - "vendor/bundle/**/*"
    # Some forks have schema.rb files in their custom engines
    - "vendor/engines/*/db/schema.rb"
    - "public/**/*"

# Project-specific overrides go here, but try to conform to TXI standards as
# specified in .rubocop-txi.yml when possible.

# We prefer this to a one-liner:
# def methodname
# end
Style/EmptyMethod:
  EnforcedStyle: expanded

# We prefer to not require %w() until you have a larger array
Style/WordArray:
  MinSize: 5

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Style/CollectionQuerying:
  Enabled: false

Rails/HttpPositionalArguments:
  Enabled: false

Rails/StrongParametersExpect:
  Enabled: false

Rails/ApplicationRecord:
  Exclude:
    - "db/migrate/*.rb"
    - "vendor/engines/*/db/migrate/*.rb"

Rails/CreateTableWithTimestamps:
  Exclude:
    - "db/migrate/20100101000000_initial_schema.rb"
    - "db/migrate/20100423185710_create_order_details.rb"
    - "db/migrate/20100528230902_add_product_users_table.rb"
    - "db/migrate/20100715171938_add_journals_table.rb"
    - "db/migrate/20100719192104_add_table_statement_accounts.rb"
    - "db/migrate/20100812170701_add_budgeted_chart_string.rb"
    - "db/migrate/20101015210647_edits_for_invoicing_and_journaling_refacting.rb"
    - "db/migrate/20101018221409_bundle_related_updates.rb"
    - "db/migrate/20110216002247_create_user_roles.rb"
    - "db/migrate/20120209231652_create_product_accessories.rb"
    - "db/migrate/20120510172358_add_bi_table.rb"
Rails/HasAndBelongsToMany:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "vendor/engines/*/spec/**/*.rb"
